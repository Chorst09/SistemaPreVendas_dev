version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-prevendas-db
    environment:
      POSTGRES_USER: prevendas
      POSTGRES_PASSWORD: prevendas123
      POSTGRES_DB: sistema_prevendas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prevendas"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema-prevendas-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://prevendas:prevendas123@postgres:5432/sistema_prevendas
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sistema-prevendas-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: sistema-prevendas-network
